    /* モダンカラー & 変数設定 */
    :root {
      --primary: #0f172a;
      --primary-blue: #2563eb;
      --accent-cyan: #06b6d4;
      --accent-teal: #10b981;
      --accent-gold: #f59e0b;
      --line-green: #06c755;
      --line-green-hover: #05b34c;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --card-shadow-hover: 0 25px 30px -5px rgba(37, 99, 235, 0.15), 0 15px 15px -5px rgba(6, 182, 212, 0.1);
      --text-main: #0f172a;
      --text-sub: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
      line-height: 1.7;
      background: #f1f5f9;
      overflow-x: hidden;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* 光沢アニメーション */
    @keyframes shine {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(300%) rotate(45deg); }
    }

    .shine-box {
      position: relative;
      overflow: hidden;
    }

    .shine-box::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 50%;
      height: 200%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
      transform: rotate(30deg);
      animation: shine 4s infinite;
    }

    /* ヘッダー */
    header {

      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }
